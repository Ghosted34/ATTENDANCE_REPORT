<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Starting…</title>
<link rel="stylesheet" href="../app/css/styles.css"><script src="../app/js/theme.js"></script></head>
<body>
  <div class="splash">
    <h1 id="brand">&nbsp;</h1>
    <div class="progress" role="progressbar"><i id="bar"></i></div>
    <p class="muted" id="text">Starting…</p>
  </div>
  <script>
    window.bridge.onStatus(({ text, pct, brand }) => {
      document.getElementById("brand").textContent = brand;
      document.getElementById("text").textContent = text + "…";
      document.getElementById("bar").style.width = pct + "%";
    });
  </script>
</body></html>
