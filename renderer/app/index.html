<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reports</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/theme.js"></script>
</head>
<body>
  <header class="bar">
    <a class="brand" id="brand" href="#/reports">Reports</a>
    <div class="actions">
      <button class="btn quiet icon" id="themeBtn" type="button" aria-label="Toggle theme" data-tooltip="Toggle theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
          <circle cx="12" cy="12" r="5"/>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
      </button>
      <button class="btn quiet icon" id="densityBtn" type="button" aria-label="Toggle row density" aria-pressed="false" data-tooltip="Row density: comfortable">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18" aria-hidden="true">
          <path d="M3 4h18M3 8h18M3 16h18M3 20h18"/>
        </svg>
      </button>
      <button class="btn quiet hidden" id="signOut" type="button">Sign out</button>
    </div>
  </header>
  <div id="view"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
